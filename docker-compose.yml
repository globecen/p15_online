services:
  pristar-p15-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pristar-p15-studio
    restart: unless-stopped
    ports:
      - "9999:8080"
    environment:
      - PORT=8080
      - ADMIN_USERNAME=admin
      # Mot de passe admin : défini lors de la 1ère connexion depuis l'interface web
      # (ou décommentez la ligne ci-dessous pour forcer un mot de passe prédéfini)
      # - ADMIN_PASSWORD=votre-mot-de-passe
      - SECRET_KEY=cle-secrete-a-personnaliser-pristar-p15-2026
      # Adresse MAC Bluetooth de votre Pristar P15 détectée
      - PRINTER_MAC=5E:55:09:10:33:13
    volumes:
      # Données persistantes (modèles personnalisés, historique)
      - ./data:/app/data
      # Prise en charge du Bluetooth hôte Linux (BlueZ / D-Bus)
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
